name: Main push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-push
  cancel-in-progress: false

jobs:
  tag-next-version:
    name: Tag next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag next version
        id: tag
        env:
          CI: "true"
        run: ./scripts/tag-next-version.sh

  deploy-pages:
    name: Deploy Pages
    needs: tag-next-version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag-next-version.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print app version
        id: version
        run: echo "version=$(./scripts/print-app-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter @caller/web build

      # The build-info badge's two files. Written after the build and before
      # the upload, so the deployed artifact carries its own identity and the
      # last twenty releases. A local build emits neither, which is how the
      # badge knows to say "dev build". `fetch-depth: 0` above is what gives
      # this the tags to read.
      - name: Write build info
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/pages/build-info.mjs --out apps/web/dist --channel pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
